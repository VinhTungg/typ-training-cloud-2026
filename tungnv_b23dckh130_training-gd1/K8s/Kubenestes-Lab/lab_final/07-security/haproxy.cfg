global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Frontend nhan ket noi HTTPS va chuyen tiep o tang TCP (Passthrough)
frontend k8s_https_frontend
    bind *:8443
    mode tcp
    default_backend k8s_ingress_https_nodeport

# Backend tro den NodePort HTTPS (30443) cua Ingress tren K8s Worker Node
backend k8s_ingress_https_nodeport
    mode tcp
    balance roundrobin
    option tcp-check
    server worker1 10.97.0.116:30443 check

