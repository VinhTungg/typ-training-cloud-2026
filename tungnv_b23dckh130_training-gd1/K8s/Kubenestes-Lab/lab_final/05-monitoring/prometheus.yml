global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cloud-final-api-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["10.97.0.116:30300"]
        labels:
          service: "api-service"
          namespace: "final-app"

  - job_name: "cloud-final-web-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["10.97.0.116:30880"]
        labels:
          service: "web-app"
          namespace: "final-app"