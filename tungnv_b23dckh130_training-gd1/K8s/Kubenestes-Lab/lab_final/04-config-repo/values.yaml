namespace: final-app

api:
  replicaCount: 1
  image:
    repository: vinhtung/cloud-final-api
    tag: "v1.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 3000
    nodePort: 30300

web:
  replicaCount: 1
  image:
    repository: vinhtung/cloud-final-web
    tag: "v1.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
    nodePort: 30880

ingress:
  enabled: true
  className: nginx
  host: final.tungnv.local
  tlsSecretName: final-app-tls